services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:latest
    container_name: cobalt
    restart: unless-stopped
    environment:
      - API_URL=http://cobalt:9000/
    # No ports exposed — only accessible to immersion via internal network

  immersion:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - COBALT_API_URL=http://cobalt:9000/
    volumes:
      # Persist generated files across container restarts
      - ./server/output:/app/output
      - ./server/cache:/app/cache
      - ./server/input:/app/input
      - ./server/temp:/app/temp
    depends_on:
      - cobalt
    restart: unless-stopped
